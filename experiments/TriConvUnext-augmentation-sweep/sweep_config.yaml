# WandB Sweep Configuration
# Usage: wandb sweep sweep_config.yaml

program: wandb_sweep.py
method: bayes  # Options: grid, random, bayes
metric:
  name: val/dice
  goal: maximize
parameters:
  learning_rate:
    values: [3e-3, 1e-3, 3e-4]
  weight_decay:
    values: [0, 1e-3, 1e-2] 
  distorsion_prob:
    values: [0.3, 0.5]
  distorsion_num_cells:
    values: [5, 8]
  distorsion_distort_limit:
    values: [0.05, 0.07]
  contrast_prob:
    values: [0.3, 0.5]
  config:
    value: "experiments/TriConvUnext-augmentation-sweep/config.json"
