program: wandb_sweep.py
method: grid
metric:
  name: final_val_dice
  goal: maximize
parameters:
  learning_rate:
    values: [3e-4, 1e-4]
  weight_decay:
    values: [0, 1e-4] 
  scheduler_params:
    values: [
      {
        "step_size": 1,
        "gamma": 0.9999
      },
      {
        "step_size": 1,
        "gamma": 0.9
      }
    ]
  config:
    value: "experiments/TriConvUnext-lr-wd-sweep/config.json"
