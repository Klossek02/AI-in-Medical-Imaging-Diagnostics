program: wandb_sweep.py
method: bayes  # Options: grid, random, bayes
metric:
  name: val/dice
  goal: maximize
parameters:
  learning_rate:
    values: [1e-3, 3e-4, 1e-4]
  weight_decay:
    values: [0, 1e-4, 1e-3] 
  scheduler_params:
    values: [
      {
        "step_size": 1,
        "gamma": 0.9999
      },
      {
        "step_size": 1,
        "gamma": 0.9
      },
      {
        "step_size": 1,
        "gamma": 0.8
      }
    ]
  loss_fn_params:
    values: [
      {
        "softmax": true,
        "to_onehot_y": true,
        "lambda_dice": 1.0,
        "lambda_focal": 2.0
      },
      {
        "softmax": true,
        "to_onehot_y": true,
        "lambda_dice": 2.0,
        "lambda_focal": 1.0
      }
    ]
  config:
    value: "experiments/TriConvUnext-lr-wd-sweep/config.json"
