# WandB Sweep Configuration
# Usage: wandb sweep sweep_config.yaml

program: wandb_sweep.py
method: bayes  # Options: grid, random, bayes
metric:
  name: val/dice
  goal: maximize
parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-3
  weight_decay:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-2
  num_epochs:
    value: 5
  base_c:
    values: [16, 32, 64]
  distorsion_prob:
    values: [0.3, 0.5]
  distorsion_num_cells:
    values: [5, 8]
  distorsion_distort_limit:
    values: [0.05, 0.07]
  noise_prob:
    values: [0.3, 0.5]
  noise_std:
    values: [0.1, 0.2, 0.3]
  contrast_prob:
    values: [0.3, 0.5]
  config:
    value: "config.json"
